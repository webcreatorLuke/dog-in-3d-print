<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dog print requests</title>
<style>
  :root { --paper:#ffffff; --ink:#14213d; --muted:#5b6478; --line:#dfe3ea; --accent:#0f8b8d; --accent-ink:#fff; --bad:#b3261e; --ok:#1e7a46; }
  @media (prefers-color-scheme: dark) { :root { --paper:#10151f; --ink:#eef1f7; --muted:#a3adc2; --line:#2a3345; --accent:#37b6b8; --accent-ink:#06191a; --bad:#ff8a80; --ok:#6fd49a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  main { max-width:880px; margin:0 auto; padding:28px 16px 64px; }
  h1 { margin:0 0 16px; font-size:1.6rem; }
  input, button { font:inherit; }
  input { color:inherit; background:transparent; border:1.5px solid var(--line); border-radius:8px; padding:9px 11px; }
  button { cursor:pointer; border-radius:8px; border:1.5px solid var(--line); background:transparent; color:inherit; padding:9px 14px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--bad); border-color:var(--bad); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  .bar input { flex:1; min-width:200px; }
  .tabs { display:flex; gap:6px; margin:0 0 16px; flex-wrap:wrap; }
  .tabs button[aria-pressed=true] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .card { display:grid; grid-template-columns:200px 1fr; gap:18px; border:1.5px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  @media (max-width:640px) { .card { grid-template-columns:1fr; } }
  .photo { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--line); }
  .meta h2 { margin:0 0 2px; font-size:1.2rem; }
  .meta p { margin:2px 0; color:var(--muted); }
  .status { font-weight:600; }
  .status.accepted { color:var(--ok); } .status.declined { color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .row input { min-width:0; }
  .empty { color:var(--muted); padding:24px 0; }
  .err { color:var(--bad); margin:8px 0; }
</style>
</head>
<body>
<main>
  <h1>Dog print requests</h1>
  <div class="bar">
    <input type="password" id="key" placeholder="Admin key" autocomplete="current-password" aria-label="Admin key">
    <button class="primary" id="load">Load requests</button>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="tabs" id="tabs" hidden></div>
  <div id="list"></div>
</main>
<script>
// Set this to your deployed Worker address (no trailing slash).
const API = "https://fun3ds-dog-orders.lukeplaysgamezandmore.workers.dev";

const $ = (id) => document.getElementById(id);
let KEY = sessionStorage.getItem("dogKey") || "", ALL = [], FILTER = "pending";
if (KEY) $("key").value = KEY;

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { "X-Admin-Key": KEY, ...(opts.headers || {}) } });
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "Request failed (" + r.status + ")"); }
  return r;
}
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => e.append(k));
  return e;
}

async function load() {
  KEY = $("key").value.trim(); $("err").textContent = "";
  try {
    const r = await api("/api/admin/requests");
    ALL = (await r.json()).requests;
    sessionStorage.setItem("dogKey", KEY);
    render();
  } catch (e) { $("err").textContent = e.message; }
}

function render() {
  const tabs = $("tabs"); tabs.hidden = false; tabs.replaceChildren();
  ["pending", "accepted", "declined", "all"].forEach((t) => {
    const n = t === "all" ? ALL.length : ALL.filter((x) => x.status === t).length;
    const b = el("button", { textContent: `${t[0].toUpperCase() + t.slice(1)} (${n})` });
    b.setAttribute("aria-pressed", String(FILTER === t));
    b.onclick = () => { FILTER = t; render(); };
    tabs.append(b);
  });
  const list = $("list"); list.replaceChildren();
  const rows = ALL.filter((x) => FILTER === "all" || x.status === FILTER);
  if (!rows.length) { list.append(el("div", { className: "empty", textContent: "No requests here yet." })); return; }
  rows.forEach((x) => list.append(card(x)));
}

function card(x) {
  const img = el("img", { className: "photo", alt: "Photo of " + x.dog_name });
  api("/api/admin/photo/" + x.id).then((r) => r.blob()).then((b) => (img.src = URL.createObjectURL(b))).catch(() => {});
  const when = new Date(x.created_at * 1000).toLocaleString();
  const meta = el("div", { className: "meta" },
    el("h2", { textContent: x.dog_name }),
    el("p", { textContent: x.customer_name + " – " + x.email }),
    el("p", { textContent: when }),
    x.notes ? el("p", { textContent: "Notes: " + x.notes }) : "",
    el("p", { className: "status " + x.status, textContent: x.status[0].toUpperCase() + x.status.slice(1) +
      (x.price_cents ? " at $" + (x.price_cents / 100).toFixed(2) : "") }));
  if (x.payment_link) meta.append(el("p", {}, el("a", { href: x.payment_link, target: "_blank", rel: "noopener", textContent: "Payment link" })));

  const row = el("div", { className: "row" });
  if (x.status === "pending") {
    const price = el("input", { type: "number", min: "0.5", step: "0.01", placeholder: "Price (USD)", style: "width:130px", ariaLabel: "Price in dollars" });
    const link = el("input", { type: "url", placeholder: "Payment link (https://…)", style: "flex:1;min-width:200px", ariaLabel: "Payment link" });
    const yes = el("button", { className: "primary", textContent: "Accept" });
    const no = el("button", { className: "danger", textContent: "Decline" });
    yes.onclick = () => decide(x.id, { action: "accept", price: price.value, payment_link: link.value });
    no.onclick = () => confirm("Decline this request?") && decide(x.id, { action: "decline" });
    row.append(price, link, yes, no);
  }
  const del = el("button", { className: "danger", textContent: "Delete" });
  del.onclick = async () => {
    if (!confirm("Delete this request and its photo for good?")) return;
    try { await api("/api/admin/requests/" + x.id, { method: "DELETE" }); await load(); } catch (e) { $("err").textContent = e.message; }
  };
  row.append(del);
  meta.append(row);
  return el("article", { className: "card" }, img, meta);
}

async function decide(id, body) {
  $("err").textContent = "";
  try {
    await api("/api/admin/requests/" + id + "/decision", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    await load();
  } catch (e) { $("err").textContent = e.message; }
}

$("load").onclick = load;
$("key").addEventListener("keydown", (e) => e.key === "Enter" && load());
if (KEY) load();
</script>
</body>
</html>
