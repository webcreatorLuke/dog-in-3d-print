<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Your Dog in a 3D Print — Admin</title>
<style>
  :root{
    --navy:#1b2436;
    --navy-2:#242f45;
    --cream:#f6f1e4;
    --mustard:#e0a63b;
    --line:#3a4560;
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(224,166,59,0.10), transparent 40%),
      var(--navy);
    color:var(--cream);
    padding:28px 20px 60px;
  }
  header{
    max-width:1100px;
    margin:0 auto 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  h1{
    font-family:'Fredoka','Nunito',sans-serif;
    font-size:1.7rem;
    margin:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .count{
    background:var(--navy-2);
    border:1px solid var(--line);
    padding:8px 16px;
    border-radius:999px;
    font-size:0.9rem;
    color:var(--mustard);
    font-weight:700;
  }
  .grid{
    max-width:1100px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px;
  }
  .card{
    background:var(--navy-2);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:var(--navy);
  }
  .card-body{
    padding:14px 16px 16px;
  }
  .card-body .name{
    font-weight:800;
    font-size:1.05rem;
    margin:0 0 4px;
  }
  .card-body .time{
    font-size:0.78rem;
    color:#98a1bb;
  }
  .empty{
    max-width:1100px;
    margin:60px auto;
    text-align:center;
    color:#98a1bb;
  }
  .empty .paw{font-size:2.4rem; display:block; margin-bottom:10px;}
  .loading{
    text-align:center;
    color:#98a1bb;
    margin-top:60px;
  }
</style>
</head>
<body>

<header>
  <h1>🐾 Get Your Dog in a 3D Print <span style="font-weight:400; opacity:.6; font-size:1rem;">— Admin</span></h1>
  <div class="count" id="countBadge">0 dogs</div>
</header>

<div id="loading" class="loading">Loading...</div>
<div class="grid" id="grid"></div>
<div class="empty" id="emptyState" style="display:none;">
  <span class="paw">🐕</span>
  No dogs submitted yet — waiting for the first one!
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ==== PASTE YOUR FIREBASE CONFIG HERE (same as index.html) ====
  const firebaseConfig = {
    apiKey: "AIzaSyDQwvDsndgIaco7NshkPy6pC5Uhk003PHI",
    authDomain: "get-your-dog-in-a-3d-print.firebaseapp.com",
    projectId: "get-your-dog-in-a-3d-print",
    storageBucket: "get-your-dog-in-a-3d-print.firebasestorage.app",
    messagingSenderId: "794863341378",
    appId: "1:794863341378:web:aa7aba83a73a14dc9502db"
  };
  // ================================================================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const emptyState = document.getElementById('emptyState');
  const countBadge = document.getElementById('countBadge');

  const q = query(collection(db, 'dogs'), orderBy('createdAt', 'desc'));

  onSnapshot(q, (snapshot) => {
    loading.style.display = 'none';

    if (snapshot.empty) {
      grid.innerHTML = '';
      emptyState.style.display = 'block';
      countBadge.textContent = '0 dogs';
      return;
    }

    emptyState.style.display = 'none';
    countBadge.textContent = `${snapshot.size} dog${snapshot.size === 1 ? '' : 's'}`;

    grid.innerHTML = '';
    snapshot.forEach(doc => {
      const d = doc.data();
      const card = document.createElement('div');
      card.className = 'card';

      const time = d.createdAt?.toDate
        ? d.createdAt.toDate().toLocaleString()
        : 'just now';

      card.innerHTML = `
        <img src="${d.photo}" alt="${escapeHtml(d.name)}">
        <div class="card-body">
          <p class="name">${escapeHtml(d.name)}</p>
          <p class="time">${time}</p>
        </div>
      `;
      grid.appendChild(card);
    });
  }, (err) => {
    loading.textContent = 'Could not load — check your Firebase setup.';
    console.error(err);
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
