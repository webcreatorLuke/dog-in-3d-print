<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Your Dog in a 3D Print</title>
<style>
  :root{
    --navy:#1b2436;
    --navy-2:#242f45;
    --cream:#f6f1e4;
    --mustard:#e0a63b;
    --mustard-dark:#c78d24;
    --line:#3a4560;
    --ok:#6fbf8b;
    --err:#e17a6b;
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
  }
  @font-face{
    font-family:'Fredoka';
    src:local('Fredoka');
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(224,166,59,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(224,166,59,0.08), transparent 45%),
      var(--navy);
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .tag{
    width:100%;
    max-width:420px;
    background:var(--navy-2);
    border:1px solid var(--line);
    border-radius:22px;
    padding:32px 28px 28px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .tag::before{
    content:"";
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--mustard);
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }
  .tag::after{
    content:"";
    position:absolute;
    top:1px;
    left:50%;
    transform:translateX(-50%);
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--navy-2);
    border:2px solid var(--navy);
  }
  h1{
    font-family:'Fredoka','Nunito',sans-serif;
    font-weight:700;
    font-size:1.7rem;
    text-align:center;
    margin:14px 0 4px;
    letter-spacing:0.3px;
  }
  .sub{
    text-align:center;
    color:#b9c0d4;
    font-size:0.92rem;
    margin:0 0 26px;
  }
  label{
    display:block;
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--mustard);
    font-weight:700;
    margin:0 0 8px;
  }
  .field{margin-bottom:20px;}
  input[type=text]{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--navy);
    color:var(--cream);
    font-size:1rem;
    outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus{border-color:var(--mustard);}
  .drop{
    border:2px dashed var(--line);
    border-radius:14px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    position:relative;
  }
  .drop:hover, .drop.drag{
    border-color:var(--mustard);
    background:rgba(224,166,59,0.06);
  }
  .drop input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
    width:100%;
    height:100%;
  }
  .drop-text{color:#b9c0d4; font-size:0.92rem;}
  .drop-text strong{color:var(--cream);}
  #preview{
    margin-top:14px;
    display:none;
    justify-content:center;
  }
  #preview img{
    max-width:100%;
    max-height:220px;
    border-radius:12px;
    border:1px solid var(--line);
  }
  button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--mustard);
    color:var(--navy);
    font-weight:800;
    font-size:1.02rem;
    cursor:pointer;
    transition:background .15s, transform .1s;
    font-family:'Fredoka','Nunito',sans-serif;
  }
  button:hover:not(:disabled){background:var(--mustard-dark);}
  button:active:not(:disabled){transform:scale(0.98);}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .status{
    margin-top:16px;
    text-align:center;
    font-size:0.9rem;
    min-height:1.2em;
  }
  .status.ok{color:var(--ok);}
  .status.err{color:var(--err);}
  .paw{
    display:block;
    text-align:center;
    font-size:1.6rem;
    margin-bottom:2px;
  }
</style>
</head>
<body>

<div class="tag">
  <span class="paw">🐾</span>
  <h1>Get Your Dog in a 3D Print</h1>
  <p class="sub">Enter a name and a photo — it'll show up on the board instantly.</p>

  <form id="dogForm">
    <div class="field">
      <label for="dogName">Dog's Name</label>
      <input type="text" id="dogName" placeholder="e.g. Biscuit" maxlength="40" required autocomplete="off">
    </div>

    <div class="field">
      <label>Photo</label>
      <div class="drop" id="dropZone">
        <input type="file" id="dogPhoto" accept="image/*" capture="environment" required>
        <div class="drop-text" id="dropText"><strong>Tap to choose</strong> or take a photo</div>
      </div>
      <div id="preview"><img id="previewImg" alt="Preview"></div>
    </div>

    <button type="submit" id="submitBtn">Send to the Board</button>
    <div class="status" id="statusMsg"></div>
  </form>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ==== PASTE YOUR FIREBASE CONFIG HERE ====
  const firebaseConfig = {
    apiKey: "AIzaSyDQwvDsndgIaco7NshkPy6pC5Uhk003PHI",
    authDomain: "get-your-dog-in-a-3d-print.firebaseapp.com",
    projectId: "get-your-dog-in-a-3d-print",
    storageBucket: "get-your-dog-in-a-3d-print.firebasestorage.app",
    messagingSenderId: "794863341378",
    appId: "1:794863341378:web:aa7aba83a73a14dc9502db"
  };
  // ==========================================

  const app = initializeApp(firebaseConfig);
  const db = getDb(app);
  function getDb(app){ return getFirestore(app); }

  const form = document.getElementById('dogForm');
  const nameInput = document.getElementById('dogName');
  const fileInput = document.getElementById('dogPhoto');
  const dropText = document.getElementById('dropText');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  const dropZone = document.getElementById('dropZone');

  let compressedDataUrl = null;

  fileInput.addEventListener('change', handleFile);
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    if (e.dataTransfer.files[0]) {
      fileInput.files = e.dataTransfer.files;
      handleFile();
    }
  });

  function handleFile(){
    const file = fileInput.files[0];
    if (!file) return;
    dropText.innerHTML = `<strong>${file.name}</strong> selected`;
    statusMsg.textContent = '';
    statusMsg.className = 'status';

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // Resize/compress so it stores well under Firestore's 1MB doc limit
        const maxDim = 900;
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        compressedDataUrl = canvas.toDataURL('image/jpeg', 0.72);

        previewImg.src = compressedDataUrl;
        preview.style.display = 'flex';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();

    if (!name || !compressedDataUrl) {
      statusMsg.textContent = 'Please add a name and a photo.';
      statusMsg.className = 'status err';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    statusMsg.textContent = '';
    statusMsg.className = 'status';

    try {
      await addDoc(collection(db, 'dogs'), {
        name,
        photo: compressedDataUrl,
        createdAt: serverTimestamp()
      });

      statusMsg.textContent = `${name} was sent to the board! 🎉`;
      statusMsg.className = 'status ok';
      form.reset();
      preview.style.display = 'none';
      previewImg.src = '';
      compressedDataUrl = null;
      dropText.innerHTML = '<strong>Tap to choose</strong> or take a photo';
    } catch (err) {
      console.error(err);
      statusMsg.textContent = 'Something went wrong — check your Firebase setup.';
      statusMsg.className = 'status err';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send to the Board';
    }
  });
</script>
</body>
</html>
